# Catppuccin Mocha, tuned after measuring 355 dark themes (contrast ratio,
# CIEDE2000 hue separation, dim-gray legibility). Mocha already had the most
# legible ANSI colors of the lot (every hue >= 7:1 on the background), so the
# palette stays; only the measured weak spots changed -- see inline notes.
# Score (dotfiles scratch metric): 5.76 -> 6.03; ANSI legibility unchanged.

# Catppuccin Mocha for kitty
# https://github.com/catppuccin/kitty

foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #f5e0dc

active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af


active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# black
color0 #45475a
color8 #6c7086  # overlay0: dim text 3.36:1 (was surface2 #585b70, 2.46:1 -- comments and secondary text were hard to read)

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #cba6f7  # mauve (was pink #f5c2e7: ΔE2000 15.2 from red, the closest pair in the palette)
color13 #d9bdfa  # lighter mauve

# cyan
color6  #89dceb  # sky (was teal #94e2d5: ΔE2000 15.6 from green)
color14 #a3e4f0  # lighter sky

# white
color7  #bac2de
color15 #cdd6f4  # text (was subtext0 #a6adc8, *darker* than color7 -- bright white was dimmer than white)
