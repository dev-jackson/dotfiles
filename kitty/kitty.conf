#: Theme ---------------------------------------------------------------------

# Included first so every override below wins over the theme file.
include theme-catppuccin-mocha.conf

#: Fonts ------------------------------------------------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Keep ligatures everywhere except right under the cursor (easier to edit).
disable_ligatures cursor
modify_font      cell_height 115%

#: Legibility ---------------------------------------------------------------

# Theme contrast already measures WCAG AA/AAA everywhere (checked), this is
# just a safety net in case a future theme swap regresses it.
text_fg_override_threshold 4.0
undercurl_style             thin-sparse
url_style                   curly

#: Tab bar (custom python renderer gives each tab its own color+icon) -----

tab_bar_edge        top
tab_bar_style       custom
tab_bar_align       left
tab_bar_min_tabs    1
tab_activity_symbol ●
bell_on_tab         "🔔 "
# Breathing room: the bar used to sit flush against the window's top/left edge.
tab_bar_margin_height 4 4
tab_bar_margin_width  6

#: Window / general look ---------------------------------------------------

# More horizontal than vertical padding: text columns read better with a gutter.
window_padding_width 6 10
window_margin_width  0
draw_minimal_borders yes
hide_window_decorations titlebar-only
# Two neighbouring splits share one gap instead of doubling it (kitty 0.50+).
collapse_window_margins yes

# kitty can't animate split geometry (layouts snap, there's no animatable
# geometry API), so the focused split is made obvious statically instead:
# unfocused text dims and the border colors from the theme get a visible width.
inactive_text_alpha 0.75
window_border_width 1pt

# Blur radius is the GPU cost here; 12 looks nearly the same as 20 behind
# 0.95 opacity and is noticeably cheaper on every frame.
background_opacity   0.95
background_blur      12

# Thin scrollbar, only while scrolling or when the mouse is over it.
scrollbar               scrolled-or-hovered
scrollbar_handle_color  #9399b2
scrollbar_track_color   #313244
scrollbar_handle_opacity 0.6
scrollbar_radius        0.5

cursor_shape                  beam
# Asymmetric easing: fade out fast, fade back in gently. Reads as a heartbeat
# rather than the symmetric on/off of ease-in-out.
cursor_blink_interval         0.6 ease-out ease-in
cursor_stop_blinking_after    15.0
# 1ms trigger threshold instead of 3ms: catches more real cursor jumps. The
# start_threshold below is what keeps TUI repaints from smearing.
cursor_trail                  1
cursor_trail_decay            0.08 0.25
cursor_trail_start_threshold  2
cursor_trail_color            #cba6f7

#: Performance ---------------------------------------------------------------

# input_delay 0 per kitty's performance docs: typed characters are processed
# immediately. sync_to_monitor stays on so scrolling never tears.
sync_to_monitor      yes
repaint_delay        8
input_delay          0

scrollback_lines     10000
enable_audio_bell    no
visual_bell_duration 0.18 ease-out linear
visual_bell_color    #f9e2af
confirm_os_window_close 0

#: Workflow ------------------------------------------------------------------

# macOS notification when a command of 10s+ finishes while you're elsewhere.
notify_on_cmd_finish unfocused 10
# Copying a block from the terminal no longer drags trailing spaces along.
strip_trailing_spaces smart
# Reopen every window, tab, split and scrollback after logout/restart (0.50+).
restore_session_after_logout yes

#: macOS quality-of-life ----------------------------------------------------

macos_option_as_alt   yes
macos_titlebar_color  background
macos_thicken_font    0.25

#: Keybindings ---------------------------------------------------------------

# Cheatsheet of the shortcuts that are actually active, generated from this very
# file at display time (see shortcuts.py). Both triggers were free: only
# shift+cmd+/ (web docs) and ctrl+shift+f1 (show_kitty_doc) were taken.
map cmd+/ launch --type=overlay --title "atajos de kitty" kitty +kitten shortcuts.py
map f1    launch --type=overlay --title "atajos de kitty" kitty +kitten shortcuts.py

map cmd+shift+r load_config_file

# Jump straight to the tab whose number the tab bar shows.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Splits weren't usable out of the box: the default layout order starts at
# `fat` and kitty ships no vsplit/hsplit bindings, only ctrl+shift+enter.
enabled_layouts splits,stack,tall,fat,grid

# iTerm2 conventions, the ones muscle memory already has on macOS. cmd+shift+d
# shadows kitty's default close_window -- that action is still on ctrl+shift+w.
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
# Zoom the focused split full-size and back (iTerm2's "maximize pane").
map cmd+shift+enter toggle_layout stack
map ctrl+cmd+r      layout_action rotate

map opt+cmd+left    neighboring_window left
map opt+cmd+right   neighboring_window right
map opt+cmd+up      neighboring_window up
map opt+cmd+down    neighboring_window down

map ctrl+cmd+left   resize_window narrower
map ctrl+cmd+right  resize_window wider
map ctrl+cmd+up     resize_window taller
map ctrl+cmd+down   resize_window shorter

map shift+cmd+left  move_tab_backward
map shift+cmd+right move_tab_forward

# cmd + scroll wheel/trackpad zooms the font (kitty 0.50+).
mouse_map cmd+wheel_up   press ungrabbed,grabbed change_font_size all +1
mouse_map cmd+wheel_down press ungrabbed,grabbed change_font_size all -1
